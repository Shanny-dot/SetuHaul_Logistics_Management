# SetuHaul demo stack for ONE t4g.micro (1 GiB RAM + 2 GiB swap). Memory caps add up to ~740 MiB.
# Started by update.sh with:  docker compose --env-file $SETUHAUL_HOME/compose.env -f deploy/server/docker-compose.yml up -d
# compose.env holds only non-secrets (APP_TAG, DOMAIN, SETUHAUL_HOME); secrets are in $SETUHAUL_HOME/.env (chmod 600), app only.
name: setuhaul

services:
  caddy:
    image: caddy:2.8.4-alpine           # multi-arch (arm64)
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]     # smoke test maps other host ports
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      UPSTREAM: app:8000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SETUHAUL_HOME:-/opt/setuhaul}/caddy/data:/data     # certificates survive restarts (avoids re-issuing)
      - ${SETUHAUL_HOME:-/opt/setuhaul}/caddy/config:/config
      - ${SETUHAUL_HOME:-/opt/setuhaul}/src:/srv/site:ro      # website files; Caddyfile serves only *.html/*.js/*.css/*.json/videos/
      - ${SETUHAUL_HOME:-/opt/setuhaul}/media:/srv/media:ro   # voice-note reply audio, served at /media/<random>.ogg
    depends_on: [app]
    mem_limit: 128m
    security_opt: ["no-new-privileges:true"]

  app:
    image: setuhaul-app:${APP_TAG:-local}
    restart: unless-stopped
    env_file: ${SETUHAUL_HOME:-/opt/setuhaul}/.env
    environment:
      SETUHAUL_DB: /data/demo_world.db
      SETUHAUL_MEDIA_DIR: /media
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ${SETUHAUL_HOME:-/opt/setuhaul}/data:/data
      - ${SETUHAUL_HOME:-/opt/setuhaul}/media:/media
    ports: ["127.0.0.1:${APP_LOCAL_PORT:-8000}:8000"]      # console, /dev, /readyz: reachable ONLY from the box (SSM session)
    depends_on: [redis]
    mem_limit: 512m
    # The app needs no Linux capabilities and writes only to /data (and /tmp).
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7.4-alpine             # multi-arch (arm64)
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", "300", "10", "--appendonly", "no"]
    volumes:
      - ${SETUHAUL_HOME:-/opt/setuhaul}/redis:/data
    mem_limit: 96m
    security_opt: ["no-new-privileges:true"]
